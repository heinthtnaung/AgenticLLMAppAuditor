# Declares what `src/` already holds, so the tool installs as a command rather
# than running under `PYTHONPATH=src`. The runtime is standard library only, so
# `dependencies` is empty; pytest is a development extra, pinned as in
# requirements.txt.

[build-system]
# 64 is the first setuptools with PEP 660 editable installs.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-llm-app-auditor"
version = "0.1.0"
description = "An SBOM-based vulnerability auditor."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
audit = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# The code is written to 100 columns; matching keeps isort from wrapping a
# one-line import that already fits.
line-length = 100
# pytest puts each test directory on sys.path, and the measurement scripts and
# their tests add `measurements/`, so a module imported by its bare name from a
# sibling is first-party. List those roots, and `src/`, so ruff groups them with
# `cli`, `report` and the rest, not third-party.
src = [
    "src",
    "tests/cli",
    "tests/council",
    "tests/deps",
    "tests/docs",
    "tests/findings",
    "tests/measurements",
    "tests/measurements/council_eval",
    "tests/organisation",
    "tests/report",
    "tests/scoring",
    "measurements",
]

[tool.ruff.lint]
# On top of ruff's defaults, enforce import order (isort). Nothing else changes.
extend-select = ["I"]

[tool.ruff.lint.isort]
# A trailing comma is not a request to explode the import: keep names on one line
# while they fit 100 columns, so sorting does not push files past 200 lines.
split-on-trailing-comma = false

# The HTML report inlines its stylesheet and script, read at render time from
# this folder (`report.html_assets`). Ship them so an installed copy renders the
# same self-contained page a source checkout does.
[tool.setuptools.package-data]
report = [
    "assets/tokens.css",
    "assets/layout.css",
    "assets/components.css",
    "assets/media.css",
    "assets/report.js",
]
